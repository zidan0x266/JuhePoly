# The network of endlink_melt.ini with polydisperse strands: Schulz-Zimm lengths with a
# number-average of 18 beads and dispersity 1.5 (other shapes: gaussian, lognormal,
# weibull_nycander_gold, and flory or poisson, which take no dispersity). Every strand
# is linked with its own number of segments N, through the Gaussian weight exp(-3 d^2 / (2 N b^2))
# and the reach N b, so short strands close more loops and long ones reach farther.

[system]
chain_length = 18                  # number-average length Ln
length_distribution = schulz_zimm
dispersity = 1.5                   # Lw/Ln
min_chain_length = 2
max_chain_length = 0               # 0 = no bound below the number of strand beads
n_chains = 5680
n_crosslinkers = 2840
functionality = 4
density = 0.85
bond_length = 1.0
mass = 1.0

[network]
procedure = ends
conversion = 0.96

[run]
seed = 0                           # 0 = fresh entropy seed (written to run_config.ini)

[output]
directory = gusev_SZ1.5
data_file = config.lmp
write_xyz = true
