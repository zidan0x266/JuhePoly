# End-linked network with the composition of No = 20 (Zhang et al., Macromolecules 2026,
# Table 1) built by Gusev's procedure at the bead density of a Kremer-Grest melt: 5680 strands
# of 18 beads and 2840 tetrafunctional cross-linkers, linked to the conversion that end-linking
# in LAMMPS reaches with the randomwalk packing (example_2).

[system]
chain_length = 18
n_chains = 5680
n_crosslinkers = 2840              # stoichiometric: four sites per cross-linker, two ends per strand
functionality = 4
density = 0.85                     # beads per sigma^3, strands and cross-linkers together
bond_length = 1.0
mass = 1.0

[network]
procedure = ends                   # Gusev & Schwarz 2019: random active ends until the conversion
conversion = 0.96

[run]
seed = 0                           # 0 = fresh entropy seed (written to run_config.ini)

[output]
directory = gusev_No20
data_file = config.lmp
write_xyz = true
