# Small network that builds in milliseconds: 200 strands of 10 beads and 100 tetrafunctional
# cross-linkers at the bead density of a Kremer-Grest melt.

[system]
chain_length = 10
n_chains = 200
n_crosslinkers = 100
functionality = 4
density = 0.85

[network]
procedure = ends
conversion = 0.95

[output]
directory = smoke_gusev
