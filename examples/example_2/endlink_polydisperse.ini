# Precursors of an end-linked network with the composition of No = 20 (Zhang et al.,
# Macromolecules 2026, Table 1) but polydisperse chains: Schulz-Zimm lengths with a
# number-average of 18 beads and dispersity 1.5. Other shapes: gaussian, lognormal,
# weibull_nycander_gold, and flory or poisson, which take no dispersity.

[system]
chain_length = 18                   # number-average length Ln
length_distribution = schulz_zimm
dispersity = 1.5                    # Lw/Ln
min_chain_length = 2
max_chain_length = 0                # 0 = no bound below the number of chain beads
n_chains = 5680
n_crosslinkers = 2840               # half the number of chains, whatever their lengths
occupancy = 0.05
bond_length = 1.0
mass = 1.0

[walk]
bond_angles = 60, 90, 120
site_weighting = legacy

[run]
seed = 0                            # 0 = fresh entropy seed (written to run_config.ini)

[output]
directory = endlink_SZ1.5
data_file = config.lmp
write_xyz = true
